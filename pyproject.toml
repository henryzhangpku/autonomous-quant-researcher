[project]
name = "autonomous-quant-researcher"
version = "0.1.0"
description = "An autonomous quant-research loop: an LLM proposes bounded hypotheses, trusted code evaluates them on immutable chronological data, and a hash-chained ledger records every trial."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Henry Zhang" }]
keywords = ["quantitative-research", "autoresearch", "loop-engineering", "backtesting", "llm-agents", "options"]
dependencies = [
    "alpaca-py>=0.43.2",
    "httpx>=0.27",
    "numpy>=2.0",
    "openai>=1.50",
    "python-dotenv>=1.0.0",
    "tzdata>=2025.2; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

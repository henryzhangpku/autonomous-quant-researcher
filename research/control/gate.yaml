version: 1
candidate_allow:
  - .research/runs/*/candidates/**
candidate_deny:
  - research/**
  - tests/**
  - archive/**
  - .git/**
forbidden_imports:
  - alpaca.trading
  - archive
  - socket
  - subprocess
  - tools.brokerage
  - trader
forbidden_capabilities:
  - account_access
  - credential_access
  - live_signal_dispatch
  - network_access
  - order_mutation
completion:
  requires_validator_exit_zero: true
  requires_result_artifact: true
  budget_exhaustion_is_success: false

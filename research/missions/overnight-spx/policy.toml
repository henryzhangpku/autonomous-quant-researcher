name = "overnight-spx-autoresearch"

[validator]
version = "overnight-spx-causal-v1"
command = ["python", "-m", "research.validators.overnight_spx", "--candidate", "{candidate}", "--data-hash", "29167dd552d786af24d644764eff434006c7a7754c48ceb09e002a15f1d9e69c", "--split", "discovery"]
pattern = 'score=(?P<value>-?[0-9]+(?:\.[0-9]+)?)'
name = "net_weekly_sharpe"
direction = "maximize"
target_metric = 1.0

[budget]
timeout_seconds = 240
max_attempts = 40
min_attempts = 12
